name: Close linked issues when merged into dev

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  contents: read
  issues: write

jobs:
  close-linked-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close issues referenced by closing keywords
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            // Only explicit closing keywords in the PR description count.
            // Example: "Closes #3" or "Fixes #3".
            const pattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+(?:(?:Bancosol-TFG\/intranet)?#)(\d+)\b/gi;
            const issueNumbers = [...new Set(
              [...body.matchAll(pattern)].map(match => Number(match[1]))
            )];

            for (const issue_number of issueNumbers) {
              const { data: issue } = await github.rest.issues.get({
                ...context.repo,
                issue_number
              });
              if (issue.pull_request || issue.state === 'closed') continue;

              await github.rest.issues.update({
                ...context.repo,
                issue_number,
                state: 'closed',
                state_reason: 'completed'
              });
              core.info(`Closed issue #${issue_number} linked from PR #${pr.number}`);
            }
