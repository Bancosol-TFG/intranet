services:
  frontend:
    container_name: bancosol-frontend
    image: node:22-alpine
    environment:
      VITE_API_PROXY_TARGET: http://app:8080
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/workspace
      - /workspace/node_modules

  app:
    container_name: bancosol-api
    build:
      context: ./api
      dockerfile: Dockerfile.dev

    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${APP_PORT:-8080}:8080"

    volumes:
      - ./api:/workspace

    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17
    container_name: bancosol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./volumes/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s

  drizzle-studio:
    container_name: bancosol-studio
    image: ghcr.io/drizzle-team/gateway:latest
    ports:
      - "5433:4983"
    environment:
      PORT: 4983
      STORE_PATH: "/app"
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
    volumes:
      - ./volumes/drizzle-conf:/app
    depends_on:
      postgres:
        condition: service_healthy

  docs:
    container_name: bancosol-docs
    build:
      context: .
      dockerfile: Dockerfile.docs
    command:
      - python
      - -m
      - zensical
      - serve
      - --config-file
      - zensical.toml
      - --dev-addr
      - 0.0.0.0:8000
    ports:
      - "${DOCS_PORT:-8001}:8000"
    volumes:
      - .:/workspace
